server {
    listen 80;
    server_name zakazhi.online www.zakazhi.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name zakazhi.online www.zakazhi.online;

    ssl_certificate /etc/letsencrypt/live/zakazhi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zakazhi.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/zakazhi_access.log;
    error_log /var/log/nginx/zakazhi_error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /sapiens/ {
        alias /var/www/html/sapiens/;
        try_files $uri $uri/ /sapiens/index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

location /mvp/ {        alias /var/www/zakazhimvp/build/;        try_files $uri $uri/ /mvp/index.html;        index index.html;                location ~* .(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {            expires 1y;            add_header Cache-Control "public, immutable";            access_log off;        }                location ~* .html$ {            expires -1;            add_header Cache-Control "no-cache, no-store, must-revalidate";        }    }

    location = /yourgos {
        return 301 /mvp/;
    }
    location /yourgos/ {
        return 301 /mvp/;
    }

    location /vangogi/ {
        alias /var/www/zakazhi.online/vangogi/;
        try_files $uri $uri/ /vangogi/index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    location /webhook-test/ {
        proxy_pass http://127.0.0.1:5678/webhook-test/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /viebalikch/ {
        alias /var/www/html/viebalikch/;
        try_files $uri $uri/ /viebalikch/index.html;
        
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    root /var/www/landing;
    index index.html;
}
